{% assign has_chords = site.data.songs[page.song_file].has_chords %}
<!-- Above the chips and outside the sheet, so getting back to the index never
     means opening the controls first. The notation note shares the row rather
     than taking one of its own: the link is short and the rest was dead space.
     Empty on Traditional, which needs no gloss, so the default view is exactly
     as tall as it was before the note existed. -->
<div id="page-top-row">
  <a id="back-link" href="{{ site.baseurl }}/hymn-index">&larr; Back to list</a>
  <span id="view-note-wrap">
    <span id="view-note"></span><!--
    Shown only for notations with a home page of their own; renderScore()
    sets the href and hides it again for the rest.
 --><a id="view-note-link" hidden target="_blank" rel="noopener">learn&nbsp;more&nbsp;&#8599;</a>
  </span>
</div>
<div id="choice-and-music">
    <!-- A horizontally scrolling chip row rather than a fixed table of cells.
         Five notations already overflowed 375px once each cell carried a PDF
         link and a tooltip; a scroller absorbs the next one too. The PDF link
         moved out to #view-download below, so a chip is one whole tap target
         instead of three small ones stacked. -->
    <div id="score-variants" role="tablist" aria-label="Notation">
    <input type="radio" id="trad" name="variant-radio" checked onclick="changeImage('trad');">
    <label class="variant-chip" for="trad">Traditional</label>

    <!-- One tab for the chord family. Whether it draws guitar or uke
         fretboards is the toggle over the score, not a tab of its own: those
         are the same lead sheet with a different diagram row.

         Songs with no chords have none of those books, so the tab keeps its
         old "Leadsheet" name there and the toggle is absent. -->
    <input type="radio" id="lead" name="variant-radio" onclick="changeImage('lead');">
    <label class="variant-chip" for="lead">{% if has_chords %}Chords{% else %}Leadsheet{% endif %}</label>

    {% if has_chords %}
    <!-- Roman is a tab, not a frets option: unlike Gtr/Uke it is the four-part
         score rather than the lead sheet, and it is the one book with no
         transpositions. Sitting on the frets toggle it looked like a third
         instrument and silently dropped the reader's transposition. -->
    <input type="radio" id="roman" name="variant-radio" onclick="changeImage('roman');">
    <label class="variant-chip" for="roman">Roman</label>
    {% endif %}

    <input type="radio" id="shapenote" name="variant-radio" onclick="changeImage('shapenote');">
    <label class="variant-chip" for="shapenote">7 Shape</label>

    <input type="radio" id="4shapenote" name="variant-radio" onclick="changeImage('4shapenote');">
    <label class="variant-chip" for="4shapenote">4 Shape</label>

    <input type="radio" id="clairnote" name="variant-radio" onclick="changeImage('clairnote');">
    <label class="variant-chip" for="clairnote">Clairnote</label>
    </div>

    <div id="music-frame">
        <!-- Both controls sit over the top left of the score, which LilyPond
             leaves blank, and each hides itself on tabs it does not apply to:
             transpose on trad and the chord books, frets on the chord tab of
             songs that have chords. -->
        <div id="score-controls">
            <!-- Two layouts, one control. When the build has found the key
                 signature for the current book, #music-frame gets .keyed and
                 this moves onto the signature itself - up arrow above it, down
                 arrow below - so the buttons point at the thing they change.
                 Without it - a song in C major has no signature to print, and
                 the books with no transposed engravings hide the control
                 anyway - it stays a left-to-right row in the blank corner,
                 which is where it has always been. -->
            <div id="transpose-control" role="group" aria-label="Transpose">
                <!-- Source order is down, readout, up: that is the corner
                     layout's low-to-high reading order, matching the keyboard
                     and the staff. The anchored layout reverses it in CSS,
                     where up must sit above. -->
                <!-- The glyph is a span rather than button text so the
                     anchored layout can swap the arrow's direction: pointing
                     left/right beside a readout, but up/down when the buttons
                     straddle the key signature. renderScore() sets both. -->
                <button type="button" id="transpose-down" onclick="changeTranspose(-1);"
                        title="Down a half step"><span class="arrow">&#9664;</span></button>
                <span id="transpose-readout" aria-live="polite">&#9834;</span>
                <button type="button" id="transpose-up" onclick="changeTranspose(1);"
                        title="Up a half step"><span class="arrow">&#9654;</span></button>
            </div>
            {% if has_chords %}
            <!-- No visible "Frets" caption: sitting beside the transpose
                 arrows the row has to stay narrow, and "Gtr / Uke / No tabs"
                 already says what it is. The aria-label carries the name for
                 screen readers. -->
            <div id="frets-control" role="group" aria-label="Fretboard diagrams">
                <button type="button" id="frets-guitar" onclick="changeFrets('guitar');"
                        title="Guitar fretboard diagrams">Gtr</button>
                <button type="button" id="frets-uke" onclick="changeFrets('uke');"
                        title="Ukulele fretboard diagrams">Uke</button>
                <button type="button" id="frets-none" onclick="changeFrets('lead');"
                        title="No fretboard diagrams">No tabs</button>
            </div>
            {% endif %}
        </div>
        <!-- Wraps the image alone, not #music-frame: the transpose and frets
             controls above are positioned against the frame and must not be
             clipped along with the paper margin. -->
        <div id="music-clip">
            <img src="/local-lilypond-outputs/{{ page.song_file }}-trad.png" alt="Loading the sheet music..." id="music-image">
        </div>
    </div>
</div>
